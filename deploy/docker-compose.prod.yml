# Production stack: Postgres, migrations, API server, frontend (nginx) and
# an optional ingestion worker. From the repo root:
#
#   cp deploy/.env.example deploy/.env      # then edit it
#   mkdir -p deploy/.secrets && echo "RGAPI-..." > deploy/.secrets/riot-api-key.txt
#   chmod 600 deploy/.secrets/riot-api-key.txt   # and set APP_UID/APP_GID in .env
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env --profile ingest up -d
#
# Only the frontend is published (HTTP_PORT, default 80); put a TLS-
# terminating proxy or load balancer in front of it for HTTPS.

name: tft-platform

# Compose mounts the Riot key with its host ownership and permissions, so
# the backend containers run as the key file's owner (APP_UID/APP_GID, e.g.
# `id -u` / `id -g` on the host) and the key can stay owner-only (chmod 600).
x-backend-user: &backend-user "${APP_UID:-10001}:${APP_GID:-10001}"

x-backend-env: &backend-env
  DATABASE_URL: postgres://${POSTGRES_USER:-tft}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-tft}?sslmode=disable
  # The key is read from this file on every request, so rotating it is
  # just rewriting deploy/.secrets/riot-api-key.txt — no restart.
  RIOT_API_KEY_FILE: /run/secrets/riot_api_key
  RIOT_APP_RATE_LIMIT_PER_SEC: ${RIOT_APP_RATE_LIMIT_PER_SEC:-20}
  RIOT_APP_RATE_LIMIT_PER_2MIN: ${RIOT_APP_RATE_LIMIT_PER_2MIN:-100}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-tft}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tft} -d ${POSTGRES_DB:-tft}"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ..
      dockerfile: deploy/migrate/Dockerfile
    image: ${IMAGE_PREFIX:-tft-platform}-migrate:${IMAGE_TAG:-latest}
    command:
      - -database
      - postgres://${POSTGRES_USER:-tft}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tft}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
    image: ${IMAGE_PREFIX:-tft-platform}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    user: *backend-user
    environment:
      <<: *backend-env
      HTTP_ADDR: :8080
      SETDATA_SYNC_INTERVAL: ${SETDATA_SYNC_INTERVAL:-6h}
    secrets:
      - riot_api_key
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../frontend
      args:
        FETCH_ASSETS: ${FETCH_ASSETS:-1}
    image: ${IMAGE_PREFIX:-tft-platform}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

  # Optional: keeps matches and meta stats fresh (bounded crawls every few
  # minutes, leaderboard re-seed every few hours). Enable with
  # `--profile ingest`. It shares the Riot key's rate limit with the API
  # server, so on a personal key leave the intervals generous.
  ingest:
    image: ${IMAGE_PREFIX:-tft-platform}-backend:${IMAGE_TAG:-latest}
    profiles: ["ingest"]
    restart: unless-stopped
    user: *backend-user
    command: ["ingest-loop"]
    environment:
      <<: *backend-env
      PLATFORMS: ${INGEST_PLATFORMS:-na1}
      SEED_INTERVAL: ${INGEST_SEED_INTERVAL:-21600}
      CRAWL_INTERVAL: ${INGEST_CRAWL_INTERVAL:-300}
    secrets:
      - riot_api_key
    depends_on:
      migrate:
        condition: service_completed_successfully

secrets:
  riot_api_key:
    file: ./.secrets/riot-api-key.txt

volumes:
  postgres-data:
